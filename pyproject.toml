[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claudio-system-regulator"
version = "0.1.0"
description = "Public-safe 24/7 regulator kernel for agentic systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Luis Rene Gonzalez" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["claudio_system_regulator*"]

